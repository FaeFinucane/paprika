[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "continual-spiking-agent"
version = "0.1.0"
description = "A small, inspectable continually learning spiking network prototype"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["."]
markers = [
  "unit: deterministic local behavior and structural invariants",
  "viability: qualitative, multi-seed behavioral and stability envelopes",
  "slow: long-running test suite member",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
files = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
